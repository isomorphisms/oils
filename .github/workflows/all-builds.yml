# Soil execution with ai-ci-owned acceptance.
#
# Soil still defines the build/test jobs.  ai-ci independently verifies the
# exact source revision and Soil's local per-task/status evidence.  GitHub
# artifacts carry the generated C++ tarball between jobs.  The upstream Soil
# HTML/tarball publisher is deliberately outside this workflow.

name: oils

on:
  pull_request:
  push:
    branches: ['soil-staging']

permissions:
  contents: read

env:
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
  GITHUB_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
  GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  raw-vm:
    runs-on: ubuntu-22.04
    needs: ['cpp-tarball']
    env:
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact C++ tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oils-cpp-tarball-${{ github.event.pull_request.head.sha || github.sha }}
          path: _release
      - name: Run and verify direct-host Soil job
        shell: bash
        run: |
          soil/worker.sh JOB-raw-vm
          soil/host-shim.sh did-all-succeed raw-vm

  dev-setup-debian:
    runs-on: ubuntu-22.04
    env:
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify direct-host Soil job
        shell: bash
        run: |
          soil/worker.sh JOB-dev-setup-debian
          soil/host-shim.sh did-all-succeed dev-setup-debian

  dummy:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: dummy
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  dev-minimal:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: dev-minimal
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}
          # Temporary upstream failure observed in the publisher-independent run.
          allowed_task_failures: lint=123
      - name: Upload failing Soil task log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soil-diagnostic-dev-minimal-${{ github.event.pull_request.head.sha || github.sha }}
          path: _tmp/soil/logs/lint.txt
          if-no-files-found: error
          retention-days: 2

  interactive:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: interactive
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  pea:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: pea
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  other-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: other-tests
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}
          # Temporary upstream failures; any other task/status remains fatal.
          allowed_task_failures: oil-python-symbols=1,build-oils-repo=1
      - name: Upload failing Soil task logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soil-diagnostic-other-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            _tmp/soil/logs/oil-python-symbols.txt
            _tmp/soil/logs/build-oils-repo.txt
          if-no-files-found: error
          retention-days: 2

  ovm-tarball:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: ovm-tarball
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}
          # Temporary upstream failure; exact task/status only.
          allowed_task_failures: make-tarball=2
      - name: Upload failing Soil task log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soil-diagnostic-ovm-tarball-${{ github.event.pull_request.head.sha || github.sha }}
          path: _tmp/soil/logs/make-tarball.txt
          if-no-files-found: error
          retention-days: 2

  app-tests:
    runs-on: ubuntu-22.04
    needs: ['cpp-tarball']
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact C++ tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oils-cpp-tarball-${{ github.event.pull_request.head.sha || github.sha }}
          path: _release
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: app-tests
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  cpp-coverage:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: cpp-coverage
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  benchmarks:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: benchmarks
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  bloaty:
    runs-on: ubuntu-22.04
    needs: ['cpp-tarball']
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact C++ tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oils-cpp-tarball-${{ github.event.pull_request.head.sha || github.sha }}
          path: _release
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: bloaty
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  benchmarks2:
    runs-on: ubuntu-22.04
    needs: ['cpp-tarball']
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact C++ tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oils-cpp-tarball-${{ github.event.pull_request.head.sha || github.sha }}
          path: _release
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: benchmarks2
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  benchmarks3:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: benchmarks3
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  cpp-small:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: cpp-small
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  cpp-tarball:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run and verify Soil job
        id: soil
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: cpp-tarball
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve exact C++ tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oils-cpp-tarball-${{ github.event.pull_request.head.sha || github.sha }}
          path: _release/oils-for-unix.tar
          if-no-files-found: error
          retention-days: 7

  cpp-spec:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: cpp-spec
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  wild:
    runs-on: ubuntu-22.04
    needs: ['cpp-tarball']
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact C++ tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oils-cpp-tarball-${{ github.event.pull_request.head.sha || github.sha }}
          path: _release
      - name: Run and verify Soil job
        uses: isomorphisms/ai-ci/soil@918e0e6eda2e7c6877dfa9b3dee236004571a8ac
        with:
          job: wild
          expected_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  maybe-merge-to-master:
    if: github.event_name == 'push' && github.ref == 'refs/heads/soil-staging'
    runs-on: ubuntu-22.04
    env:
      REPO_ROOT: ${{ github.workspace }}
    needs: ['dummy', 'bloaty', 'benchmarks', 'benchmarks2', 'benchmarks3', 'dev-minimal', 'cpp-coverage', 'cpp-small', 'cpp-spec', 'cpp-tarball', 'interactive', 'ovm-tarball', 'pea', 'other-tests', 'app-tests', 'wild', 'raw-vm', 'dev-setup-debian']
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run and verify Soil merge job
        shell: bash
        env:
          SOIL_GITHUB_API_TOKEN: ${{ secrets.SOIL_GITHUB_API_TOKEN }}
        run: |
          soil/worker.sh JOB-maybe-merge
          soil/host-shim.sh did-all-succeed maybe-merge
